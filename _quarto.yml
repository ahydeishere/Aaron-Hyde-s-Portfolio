project:
  type: website
  output-dir: docs

website:
  title: "Aaron Hyde | Data Science Portfolio"
  description: "Aaron Hyde's data science, economics, and R projects."
  site-url: "https://ahydeishere.github.io/Aaron-Hyde-s-Portfolio/"
  favicon: Images/favicon.png
  back-to-top-navigation: true
  repo-url: "https://github.com/ahydeishere/Aaron-Hyde-s-Portfolio"

  navbar:
    background: primary
    search: true
    left:
      - text: "Home"
        file: index.qmd
      - text: "Resume"
        file: resume.qmd
      - text: "Data Cleansing"
        file: cleansing.qmd
      - text: "Data Exploration"
        file: exploration.qmd
      - text: "Storytelling"
        file: story_telling.qmd
      - text: "Machine Learning"
        file: ml.qmd
      - text: "Full Stack"
        file: full_stack.qmd
      - text: "Competitions"
        file: competition.qmd
    right:
      - icon: github
        href: "https://github.com/ahydeishere/Aaron-Hyde-s-Portfolio"
        aria-label: GitHub
      - icon: linkedin
        href: "https://www.linkedin.com/in/aaron-m-hyde/"
        aria-label: LinkedIn

  page-footer:
    border: true
    left: "Aaron Hyde © 2026"
    right: "Built with R and Quarto"

format:
  html:
    theme:
      light: flatly
      dark: darkly
    css: styles.css
    toc: true
    code-fold: true
    code-tools: true
    smooth-scroll: true

execute:
  freeze: auto
